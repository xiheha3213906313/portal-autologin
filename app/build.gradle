plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
def hasLocalSigning = rootProject.file('signing/module.p12').isFile() &&
    rootProject.file('signing/password').isFile()
android {
    namespace 'local.portal.autologin'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'local.portal.autologin'
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName '0.4.1'
    }
    signingConfigs {
        if (hasLocalSigning) {
            release {
                storeFile rootProject.file('signing/module.p12')
                storePassword rootProject.file('signing/password').text.trim()
                keyAlias 'module'
                keyPassword rootProject.file('signing/password').text.trim()
            }
        }
    }
    buildTypes {
        release {
            if (hasLocalSigning) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { compose true }
    sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/portal')
    packaging { resources { excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1'] } }
}
def generatePortalScript = tasks.register('generatePortalScript') {
    def input = file('src/main/assets/login.js')
    def output = layout.buildDirectory.file('generated/portal/local/portal/autologin/LoginScript.java')
    inputs.file(input)
    outputs.file(output)
    doLast {
        def dest = output.get().asFile
        dest.parentFile.mkdirs()
        dest.text = 'package local.portal.autologin;\nfinal class LoginScript { static final String CODE = ' + groovy.json.JsonOutput.toJson(input.getText('UTF-8')) + '; }\n'
    }
}
tasks.named('preBuild').configure { dependsOn generatePortalScript }
dependencies {
    compileOnly files('../toolchain/xposed.jar')
    implementation 'top.yukonga.miuix.kmp:miuix-android:0.5.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.foundation:foundation:1.8.2'
    implementation 'androidx.compose.ui:ui:1.8.2'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
}
